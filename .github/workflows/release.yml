# Builds TypeTorchSync.rbxm with Rojo (the version rokit.toml pins) and publishes it as a GitHub release, with the rbxm
# also kept as a workflow artifact. Runs only on a version tag pushed by a maintainer, never on PRs (no npm):
#   npm version <x.y.z> -m "release %s" && git push origin main --follow-tags
# The tag must match package.json. Install a release: download TypeTorchSync.rbxm into Studio's plugins folder
# (Windows: %LOCALAPPDATA%\Roblox\Plugins) and restart Studio, or reload plugins.
# A stable tag (no "-" in the version) then updates the plugin's Creator Store asset through Open Cloud (job "roblox",
# .github/scripts/roblox-upload.sh): the rbxm, then the description (.github/store-description.txt + version, date, changes).
# Its key lives only in the "roblox" environment: secret ROBLOX_API_KEY, variable ROBLOX_PLUGIN_ASSET_ID (optional
# ROBLOX_ASSET_TYPE, default Plugin). Without them the job is skipped with a notice and the GitHub release still ships.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the GitHub release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rojo
        run: |
          set -euo pipefail
          version=$(sed -n 's/^rojo = "rojo-rbx\/rojo@\(.*\)"/\1/p' rokit.toml)
          curl -sSLf -o "$RUNNER_TEMP/rojo.zip" "https://github.com/rojo-rbx/rojo/releases/download/v${version}/rojo-${version}-linux-x86_64.zip"
          unzip -oq "$RUNNER_TEMP/rojo.zip" -d "$RUNNER_TEMP/tools"
          chmod +x "$RUNNER_TEMP/tools/rojo"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
      - name: Build TypeTorchSync.rbxm
        run: |
          rojo --version
          rojo build default.project.json -o TypeTorchSync.rbxm
          ls -l TypeTorchSync.rbxm
      - uses: actions/upload-artifact@v4
        with:
          name: TypeTorchSync-${{ github.sha }}
          path: TypeTorchSync.rbxm
          if-no-files-found: error
      - name: GitHub release
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} but package.json is ${version}"
            exit 1
          fi
          prerelease=""
          case "$version" in *-*) prerelease=--prerelease ;; esac
          gh release create "${GITHUB_REF_NAME}" TypeTorchSync.rbxm --title "${GITHUB_REF_NAME}" --generate-notes $prerelease
        env:
          GH_TOKEN: ${{ github.token }}

  roblox:
    needs: build
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    environment: roblox
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags and history for the description's change list
      - uses: actions/download-artifact@v4
        with:
          name: TypeTorchSync-${{ github.sha }}
      - name: Update the Roblox asset
        run: |
          if [ -z "${API_KEY}" ] || [ -z "${ASSET_ID}" ]; then
            echo "::notice::ROBLOX_API_KEY or ROBLOX_PLUGIN_ASSET_ID not set in the roblox environment, skipping the upload"
            exit 0
          fi
          .github/scripts/roblox-upload.sh
        env:
          API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ASSET_ID: ${{ vars.ROBLOX_PLUGIN_ASSET_ID }}
          ASSET_TYPE: ${{ vars.ROBLOX_ASSET_TYPE }}
